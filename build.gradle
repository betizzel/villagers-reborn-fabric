plugins {
    id 'fabric-loom' version '1.12.7' apply false
}

allprojects {
    group = 'local.fabricports'
    version = '1.0.0+fabric.1.20.1'

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.createmod.net/' }
        maven { url = 'https://mvn.devos.one/releases/' }
        maven { url = 'https://mvn.devos.one/snapshots/' }
        maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
        maven { url = 'https://maven.jamieswhiteshirt.com/libs-release/' }
        maven { url = 'https://maven.shedaniel.me/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.blamejared.com/' }
        maven { url = 'https://maven.ladysnake.org/releases/' }
        maven { url = 'https://maven.kosmx.dev/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://api.modrinth.com/maven/' }
        maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
        maven { url = 'https://maven.kikugie.dev/releases/' }
        maven { url = 'https://www.cursemaven.com/' }
        maven {
            url = 'https://jitpack.io/'
            content { includeGroup 'com.github.BlueMap-Minecraft' }
        }
    }
}

subprojects {
    apply plugin: 'fabric-loom'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
        options.compilerArgs += ['-Xmaxerrs', '10000']
    }

    tasks.withType(ProcessResources).configureEach {
        inputs.property('version', project.version)
        filesMatching('fabric.mod.json') {
            expand(version: project.version)
        }
    }

    def moduleRunDirectory = rootProject.file("work/run/${project.name}")

    loom {
        runs {
            server { runDir("${moduleRunDirectory}/server") }
            client { runDir("${moduleRunDirectory}/client") }
        }
    }
}
